<rect data-part="key" x="111.3333333333" y="66" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="key" x="18.6666666667" y="111" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="key" x="65" y="111" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="key" x="111.3333333333" y="111" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="key" x="18.6666666667" y="156" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="key" x="65" y="156" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="key" x="111.3333333333" y="156" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
  </g>

