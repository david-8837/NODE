<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <!-- Grey/white welcome and finish panel; device matches the home screen. -->
  <rect width="164" height="314" fill="#f4f4f4"/>
  <rect x="0" y="0" width="2" height="314" fill="#aaaaaa"/>

  <text x="18" y="31" fill="#333333" font-family="DejaVu Sans" font-size="16" font-weight="700" letter-spacing="0.8">NODE</text>
  <text x="18" y="45" fill="#777777" font-family="DejaVu Sans" font-size="7.4" font-weight="700" letter-spacing="1.2">studio</text>
  <path d="M18 60H146" fill="none" stroke="#cccccc"/>

  <text x="18" y="86" fill="#333333" font-family="DejaVu Sans" font-size="10.5" font-weight="700" letter-spacing="0.6">MAKE IT</text>
  <text x="18" y="101" fill="#333333" font-family="DejaVu Sans" font-size="10.5" font-weight="700" letter-spacing="0.6">YOUR OWN.</text>
  <text x="18" y="118" fill="#777777" font-family="DejaVu Sans" font-size="6.2">Your keys. Your flow.</text>

  <!-- Home-screen proportions: 172 x 216, not a square generic keypad. -->
  <g id="micro-pad" transform="translate(23.52 128) scale(0.68)">
<rect data-part="case" x="0" y="0" width="172" height="216" rx="24" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="inner-frame" x="12" y="12" width="148" height="192" rx="16" fill="#ebebeb"/>
<circle data-part="status-light" cx="39" cy="39" r="2.5" fill="#888888"/>
<circle data-part="dial" cx="130.6666666667" cy="39" r="19.5" fill="#fafafa" stroke="#999999" stroke-width="2"/>
<line data-part="dial-marker" x1="117.1666666667" y1="39" x2="144.1666666667" y2="39" stroke="#999999" stroke-width="2" stroke-linecap="round"/>
<rect data-part="key" x="18.6666666667" y="66" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="key" x="65" y="66" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="key" x="111.3333333333" y="66" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="key" x="18.6666666667" y="111" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="key" x="65" y="111" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="key" x="111.3333333333" y="111" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="key" x="18.6666666667" y="156" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="key" x="65" y="156" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
<rect data-part="key" x="111.3333333333" y="156" width="42" height="42" rx="5" fill="#ffffff" stroke="#aaaaaa" stroke-width="2"/>
  </g>

  <path d="M18 288H146" fill="none" stroke="#cccccc"/>
  <text x="18" y="303" fill="#777777" font-family="DejaVu Sans" font-size="5.3" font-weight="700" letter-spacing="0.7">NINE KEYS. ONE DIAL.</text>
</svg>
