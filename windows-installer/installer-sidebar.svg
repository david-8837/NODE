<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="0.55" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="keycap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d2d2d2"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="weave" width="11" height="11" patternUnits="userSpaceOnUse">
      <path d="M11 0H0V11" fill="none" stroke="#ffffff" stroke-opacity="0.022" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Panel -->
  <rect width="164" height="314" fill="url(#panel)"/>
  <rect width="164" height="314" fill="url(#weave)"/>
  <rect x="0" y="0" width="2" height="314" fill="#ffffff"/>

  <!-- Wordmark -->
  <text x="18" y="31" fill="#ffffff" font-family="DejaVu Sans" font-size="16" font-weight="700" letter-spacing="0.8">NØDE</text>
  <text x="18" y="45" fill="#8c8c8c" font-family="DejaVu Sans" font-size="5.4" font-weight="700" letter-spacing="1.2">GRID MACRO 1 STUDIO</text>
  <circle cx="143" cy="24" r="2.6" fill="#ffffff"/>
  <circle cx="143" cy="24" r="5.6" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>

  <path d="M18 60H146" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>

  <!-- Headline -->
  <text x="18" y="86" fill="#ffffff" font-family="DejaVu Sans" font-size="10.5" font-weight="700" letter-spacing="0.6">MAKE IT</text>
  <text x="18" y="101" fill="#ffffff" font-family="DejaVu Sans" font-size="10.5" font-weight="700" letter-spacing="0.6">YOUR OWN.</text>
  <text x="18" y="118" fill="#9a9a9a" font-family="DejaVu Sans" font-size="6.2">Your keys. Your flow.</text>

  <!-- Macro pad: nine keys, one lit -->
  <ellipse cx="82" cy="196" rx="62" ry="58" fill="url(#halo)"/>
  <g fill="url(#keycap)" stroke="#4e4e4e" stroke-width="1.2">
    <rect x="19" y="142" width="38" height="38" rx="3"/>
    <rect x="63" y="142" width="38" height="38" rx="3"/>
    <rect x="107" y="142" width="38" height="38" rx="3"/>
    <rect x="19" y="186" width="38" height="38" rx="3"/>
    <rect x="107" y="186" width="38" height="38" rx="3"/>
    <rect x="19" y="230" width="38" height="38" rx="3"/>
    <rect x="63" y="230" width="38" height="38" rx="3"/>
    <rect x="107" y="230" width="38" height="38" rx="3"/>
  </g>
  <!-- Focal key, inverted to white -->
  <rect x="63" y="186" width="38" height="38" rx="3" fill="url(#lit)"/>
  <rect x="75" y="198" width="14" height="14" rx="2" fill="#0a0a0a"/>
  <!-- Keycap top highlights -->
  <g stroke="#ffffff" stroke-opacity="0.09" stroke-width="1">
    <path d="M22 145H54M66 145H98M110 145H142"/>
    <path d="M22 189H54M110 189H142"/>
    <path d="M22 233H54M66 233H98M110 233H142"/>
  </g>

  <!-- Dial -->
  <path d="M19 282H70M94 282H145" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <circle cx="82" cy="282" r="7.5" fill="none" stroke="#6a6a6a" stroke-width="1.2"/>
  <circle cx="82" cy="282" r="2.4" fill="#ffffff"/>

  <text x="18" y="303" fill="#9a9a9a" font-family="DejaVu Sans" font-size="5.3" font-weight="700" letter-spacing="0.7">NINE KEYS. ONE DIAL.</text>
</svg>
