[package]
name = "haze"
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
default = []
ffi = []
raw-window-handle = ["dep:raw-window-handle"]

[dependencies]
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation", "Foundation_Collections", "Foundation_Metadata",
    "Graphics", "Graphics_Effects", "System", "UI", "UI_Composition",
    "UI_Composition_Desktop", "Win32_Foundation", "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_WinRT",
    "Win32_System_WinRT_Composition", "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging",
] }
windows-collections = "0.2"
windows-core = "0.61"
windows-numerics = "0.2"
