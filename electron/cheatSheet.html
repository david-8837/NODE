<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="cheatSheet.css">
  <title>Micro Pad Cheat-Sheet</title>
</head>
<body>
  <main>
    <header>
      <span class="title"><span class="indicator" aria-hidden="true"></span>MICRO PAD</span>
      <span class="status"><span id="layer">LAYER 1</span><span class="dial" aria-label="Dial"><span class="dial-mark"></span></span></span>
    </header>
    <div class="dial-actions" aria-label="Dial assignments">
      <div class="dial-action"><span class="direction" aria-hidden="true">↶</span><span id="dial-ccw" class="dial-label" aria-label="Turn left">—</span></div>
      <div class="dial-action"><span class="direction" aria-hidden="true">●</span><span id="dial-press" class="dial-label" aria-label="Press dial">—</span></div>
      <div class="dial-action"><span class="direction" aria-hidden="true">↷</span><span id="dial-cw" class="dial-label" aria-label="Turn right">—</span></div>
    </div>
    <div id="keys" class="keys"></div>
  </main>
  <script src="cheatSheetRenderer.js"></script>
</body>
</html>
