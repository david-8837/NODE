<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="cheatSheet.css">
  <title>Micro Pad Cheat-Sheet</title>
</head>
<body>
  <main>
    <header>MICRO PAD <span id="layer">LAYER 1</span></header>
    <div class="device-top" aria-label="Micro Pad indicator and dial">
      <div class="indicator" aria-hidden="true"><span></span></div>
      <div class="dial-actions" aria-label="Dial assignments">
        <div><span class="direction">↶</span><span id="dial-ccw" class="dial-label" aria-label="Turn left">—</span></div>
        <div><span class="direction">●</span><span id="dial-press" class="dial-label" aria-label="Press dial">—</span></div>
        <div><span class="direction">↷</span><span id="dial-cw" class="dial-label" aria-label="Turn right">—</span></div>
      </div>
      <div class="dial" aria-label="Dial"><span class="dial-mark"></span></div>
    </div>
    <div id="keys" class="keys"></div>
  </main>
  <script src="cheatSheetRenderer.js"></script>
</body>
</html>
