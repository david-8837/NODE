name: Windows Desktop Package

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a release only after the Windows and QMK builds pass
        type: boolean
        required: false
        default: false
  push:
    branches: [arena/56095c72-node]
    tags:
      - 'v*'
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'electron/**'
      - 'src/**'
      - 'native-executor.ts'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'public/favicon.ico'
      - 'windows-installer/**'
      - 'tests/**'
      - 'vite.config.ts'

permissions:
  contents: write

jobs:
  package-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build installer and ZIP
        run: npm run build:win

      - name: Install packaged app and capture responsive UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path 'dist_electron' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'electron-builder did not produce a Windows installer' }

          $installDir = Join-Path $env:RUNNER_TEMP 'node-grid-macro-1-smoke'
          $appDataRoot = Join-Path $env:RUNNER_TEMP 'node-grid-macro-1-smoke-appdata'
          $localAppDataRoot = Join-Path $env:RUNNER_TEMP 'node-grid-macro-1-smoke-localappdata'
          New-Item -ItemType Directory -Force -Path $appDataRoot, $localAppDataRoot | Out-Null
          $env:APPDATA = $appDataRoot
          $env:LOCALAPPDATA = $localAppDataRoot
          "APPDATA=$appDataRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALAPPDATA=$localAppDataRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $installArgs = @('/S', "/D=$installDir")
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList $installArgs -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Silent installer exited with code $($installProcess.ExitCode)" }

          $app = Get-ChildItem -Path $installDir -Filter '*.exe' | Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1
          if (-not $app) { throw "Installed application executable was not found in $installDir" }

          # The installer may offer to start the app on finish; close that copy so
          # the smoke-test launch receives its own screenshot path and exit code.
          Start-Sleep -Seconds 1
          $appProcessName = [System.IO.Path]::GetFileNameWithoutExtension($app.Name)
          Get-Process -Name $appProcessName -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          $screenshot = Join-Path $env:RUNNER_TEMP 'packaged-ui-visual-smoke.png'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'packaged-ui-visual-smoke-diagnostics.json'
          $env:NODE_GRID_VISUAL_SMOKE_SCREENSHOT = $screenshot
          $env:NODE_GRID_VISUAL_SMOKE_DIAGNOSTICS = $diagnostics
          $appProcess = Start-Process -FilePath $app.FullName -ArgumentList '--visual-smoke-test' -PassThru
          if (-not $appProcess.WaitForExit(150000)) {
            Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged app did not finish its visual and memory smoke test within 150 seconds'
          }
          $appProcess.Refresh()
          if ($appProcess.ExitCode -ne 0) { throw "Packaged app visual smoke test exited with code $($appProcess.ExitCode)" }
          if (-not (Test-Path $screenshot)) { throw 'Packaged app did not write its screenshot' }

          $png = [System.IO.File]::ReadAllBytes($screenshot)
          if ($png.Length -lt 4096 -or [System.BitConverter]::ToString($png[0..7]) -ne '89-50-4E-47-0D-0A-1A-0A') {
            throw "Screenshot is missing, too small, or not a PNG ($($png.Length) bytes)"
          }
          $width = [System.Net.IPAddress]::NetworkToHostOrder([System.BitConverter]::ToInt32($png, 16))
          $height = [System.Net.IPAddress]::NetworkToHostOrder([System.BitConverter]::ToInt32($png, 20))
          if ($width -lt 640 -or $height -lt 520) { throw "Screenshot dimensions are unexpectedly small: ${width}x${height}" }
          Write-Host "Packaged Windows UI screenshot validated: ${width}x${height}, $($png.Length) bytes"
          Copy-Item $screenshot 'dist_electron/packaged-ui-visual-smoke.png' -Force

          if (-not (Test-Path $diagnostics)) { throw 'Packaged app did not write browser smoke diagnostics' }
          $smokeReport = Get-Content -Path $diagnostics -Raw | ConvertFrom-Json
          if ($smokeReport.stage -ne 'browser-smoke-passed') { throw 'Packaged Chromium icon-picker smoke did not report success' }
          if ($smokeReport.browserSmokeResult.initialLazyAssetCount -ne 0) {
            throw 'A deferred icon asset was requested before the icon picker opened'
          }
          if (-not $smokeReport.browserSmokeResult.fullIconCatalogAvailable -or
              -not $smokeReport.browserSmokeResult.iconSearchSelected -or
              -not $smokeReport.browserSmokeResult.emojiSearchSelected) {
            throw 'Packaged Chromium did not verify full icon browsing, search, and emoji selection'
          }
          $memorySoak = $smokeReport.browserSmokeResult.memorySoak
          if (-not $memorySoak -or -not $memorySoak.passed -or -not $memorySoak.gcAvailable) {
            throw 'Packaged Chromium renderer memory soak did not pass with forced garbage collection'
          }
          if ($memorySoak.iterations -ne 30 -or
              $memorySoak.maxCheckpointGrowthBytes -gt $memorySoak.maxRetainedHeapGrowthBytes) {
            throw 'Packaged Chromium renderer heap growth exceeded the 8 MiB retained-growth budget'
          }
          if (-not $memorySoak.rendererProcess.before -or -not $memorySoak.rendererProcess.after) {
            throw 'Electron renderer process memory samples are missing'
          }
          Copy-Item $diagnostics 'dist_electron/packaged-ui-visual-smoke-diagnostics.json' -Force
          Write-Host "Packaged Chromium icon-picker checks passed: $($smokeReport.browserSmokeResult | ConvertTo-Json -Compress)"
          Write-Host "Renderer heap after GC grew $($memorySoak.retainedHeapGrowthMiB) MiB across $($memorySoak.iterations) measured picker/screen cycles (budget $([math]::Round($memorySoak.maxRetainedHeapGrowthBytes / 1MB, 1)) MiB); process private-byte delta: $($memorySoak.rendererProcess.deltaKb.privateBytes) KiB"

      - name: Verify installed-app Settings/profile persistence and uninstall behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'node-grid-macro-1-smoke'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'installed-app-persistence-smoke.json'
          $workflowStage = 'locating-installed-app'
          try {
            $app = Get-ChildItem -Path $installDir -Filter '*.exe' -File |
              Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1
            if (-not $app) { throw "Installed application executable was not found in $installDir" }

            $env:NODE_GRID_PERSISTENCE_SMOKE = '1'
            $env:NODE_GRID_PERSISTENCE_SMOKE_DIAGNOSTICS = $diagnostics
            foreach ($phase in @('write', 'verify')) {
              $workflowStage = "persistence-phase-$phase"
              $env:NODE_GRID_PERSISTENCE_PHASE = $phase
              $smokeProcess = Start-Process -FilePath $app.FullName `
                -ArgumentList @('--persistence-smoke-test') -PassThru
              if (-not $smokeProcess.WaitForExit(90000)) {
                Stop-Process -Id $smokeProcess.Id -Force -ErrorAction SilentlyContinue
                throw "Installed-app persistence smoke phase '$phase' timed out"
              }
              $smokeProcess.Refresh()
              if ($smokeProcess.ExitCode -ne 0) {
                throw "Installed-app persistence smoke phase '$phase' exited with code $($smokeProcess.ExitCode)"
              }
              Write-Host "Installed-app persistence phase passed: $phase"
            }

            $workflowStage = 'reading-app-storage-locations'
            $smokeDetails = Get-Content -Path $diagnostics -Raw | ConvertFrom-Json
            $appDataRoots = @($env:APPDATA, $env:LOCALAPPDATA) |
              Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
            $userDataPath = [System.IO.Path]::GetFullPath([string]$smokeDetails.userDataPath)
            $workflowStage = 'validating-isolated-user-data-path'
            $dataRootMatch = $appDataRoots | Where-Object {
              $normalizedRoot = [System.IO.Path]::GetFullPath($_).TrimEnd([char[]]@([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar))
              $userDataPath.Equals($normalizedRoot, [System.StringComparison]::OrdinalIgnoreCase) -or
                $userDataPath.StartsWith(
                  $normalizedRoot + [System.IO.Path]::DirectorySeparatorChar,
                  [System.StringComparison]::OrdinalIgnoreCase
                )
            } | Select-Object -First 1
            if (-not $dataRootMatch) {
              throw "Installed app data path is outside the isolated APPDATA/LOCALAPPDATA roots: $userDataPath"
            }

            $workflowStage = 'locating-native-settings'
            $settingsFilePath = [string]$smokeDetails.settingsFilePath
            if (-not $settingsFilePath -or -not (Test-Path -LiteralPath $settingsFilePath -PathType Leaf)) {
              throw "Native Settings file was not created at the installed app path: $settingsFilePath"
            }
            $settingsFile = Get-Item -LiteralPath $settingsFilePath

            $workflowStage = 'validating-native-settings'
            $settings = Get-Content -LiteralPath $settingsFile.FullName -Raw | ConvertFrom-Json
            if ($settings.allowTerminalSmartActions -ne $true) {
              throw 'Native terminal-action Settings did not persist across the packaged-app restart'
            }

            $workflowStage = 'locating-chromium-storage'
            $localStoragePath = Join-Path $userDataPath 'Local Storage'
            if (-not (Test-Path -LiteralPath $localStoragePath -PathType Container)) {
              throw "Chromium local profile storage was not created at the installed app path: $localStoragePath"
            }
            $localStorageDir = Get-Item -LiteralPath $localStoragePath

            $workflowStage = 'locating-uninstaller'
            $uninstaller = Get-ChildItem -Path $installDir -Filter 'Uninstall*.exe' -File | Select-Object -First 1
            if (-not $uninstaller) { throw "NSIS uninstaller was not found in $installDir" }

            $workflowStage = 'running-uninstaller'
            $uninstallProcess = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/S') -Wait -PassThru
            if ($uninstallProcess.ExitCode -ne 0) {
              throw "Silent uninstaller exited with code $($uninstallProcess.ExitCode)"
            }

            $workflowStage = 'checking-app-removal'
            if (Test-Path $app.FullName) { throw 'The app executable remains after uninstall' }

            $workflowStage = 'checking-settings-retention'
            if (-not (Test-Path $settingsFile.FullName)) {
              throw 'Uninstall unexpectedly deleted native Settings despite deleteAppDataOnUninstall=false'
            }

            $workflowStage = 'checking-profile-retention'
            if (-not (Test-Path $localStorageDir.FullName)) {
              throw 'Uninstall unexpectedly deleted local profile storage despite deleteAppDataOnUninstall=false'
            }

            $workflowStage = 'copying-smoke-diagnostics'
            Copy-Item $diagnostics 'dist_electron/installed-app-persistence-smoke.json' -Force
            $workflowStage = 'complete'
            Write-Host 'Installed-app native Settings and structured profiles survived restart; uninstall preserved user data.'
          } catch {
            $failureMessage = $_.Exception.Message
            $smokeDetails = $null
            if (Test-Path $diagnostics) {
              try { $smokeDetails = Get-Content -Path $diagnostics -Raw | ConvertFrom-Json } catch {}
            }
            $failureDetails = [ordered]@{
              stage = 'persistence-workflow-failed'
              workflowStage = $workflowStage
              error = $failureMessage
              smokeDiagnostics = $smokeDetails
            }
            $failureDetails | ConvertTo-Json -Depth 8 | Set-Content -Path $diagnostics -Encoding utf8
            throw
          }

      - name: Report Windows app smoke failure details
        if: failure()
        shell: pwsh
        run: |
          foreach ($name in @('packaged-ui-visual-smoke-diagnostics.json', 'installed-app-persistence-smoke.json')) {
            $diagnostics = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $diagnostics) {
              $message = (Get-Content -Path $diagnostics -Raw).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=$name::$message"
            }
          }

      - name: Publish tagged Windows release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $installer = Get-ChildItem -Path 'dist_electron' -Filter '*.exe' -File | Select-Object -First 1
          $portableZip = Get-ChildItem -Path 'dist_electron' -Filter '*.zip' -File | Select-Object -First 1
          if (-not $installer -or -not $portableZip) { throw 'Expected installer and ZIP assets before publishing' }
          $assets = @($installer.FullName, $portableZip.FullName)

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --verify-tag --title "NØDE Grid Macro 1 Studio $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish Windows release $tag" }

      - name: Upload Windows packages and visual check
        uses: actions/upload-artifact@v4
        with:
          name: node-grid-macro-1-windows-x64
          path: |
            dist_electron/*.exe
            dist_electron/*.zip
            dist_electron/packaged-ui-visual-smoke.png
            dist_electron/packaged-ui-visual-smoke-diagnostics.json
            dist_electron/installed-app-persistence-smoke.json
          if-no-files-found: error
          retention-days: 14

  build-qmk-for-release:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/arena/56095c72-node' && startsWith(github.event.head_commit.message, 'release: publish 1.0.11'))
    uses: ./.github/workflows/qmk-build.yml
    permissions:
      contents: read

  publish-verified-builds:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/arena/56095c72-node' && startsWith(github.event.head_commit.message, 'release: publish 1.0.11'))
    needs: [package-windows, build-qmk-for-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: node-grid-macro-1-windows-x64
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: grid-macro-1-via-firmware
          path: release/firmware
      - name: Verify artifacts and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release or tag $tag already exists; refusing to overwrite it" >&2
            exit 1
          fi
          (cd release/firmware && sha256sum -c SHA256SUMS.txt)
          grep -Fx "Repository commit: $GITHUB_SHA" release/firmware/BUILD-INFO.txt
          mapfile -d '' installers < <(find release/windows -maxdepth 1 -type f -name '*.exe' -print0)
          mapfile -d '' zips < <(find release/windows -maxdepth 1 -type f -name '*.zip' -print0)
          [[ ${#installers[@]} == 1 && ${#zips[@]} == 1 ]]
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Adds a connection-required screen: the workspace is blocked until the macropad connects, and locally saved assignments are restored when the app reopens.

          Partial safety release: desktop profile recovery, device-keymap conflict checks and authorized USB reconnection improvements. These changes do not complete the requested standalone multi-action firmware or atomic firmware storage redesign. Standard VIA keymap writes are not atomic and can be interrupted. Physical USB, device power-cycle and background-action behavior have not been validated. When presented with a configuration conflict, cancel to preserve the device keymap unless you intend to replace it.

          This release includes the existing QMK/VIA firmware rebuilt without functional firmware changes; flashing is not required for the desktop safety changes. The app must remain running for desktop-dependent actions. Enable Launch app at startup in Settings if desired.

          Windows installer and portable build are unsigned. The QMK/VIA UF2 targets the repository's RP2040-Zero configuration and was compiled in CI, but has not been validated on a physical board. Verify board revision, wiring, USB identity and recovery procedure before flashing. The previous checked-in firmware manifest mismatch remains a historical provenance issue; use the checksum and build information attached to this release for this newly built UF2.
          NOTES
          gh release create "$tag" --target "$GITHUB_SHA" --draft --title "NØDE Grid Macro 1 Studio $tag" --notes-file "$RUNNER_TEMP/release-notes.md" "${installers[0]}" "${zips[0]}" release/firmware/grid_macro_1_via.uf2 release/firmware/SHA256SUMS.txt release/firmware/BUILD-INFO.txt
          gh release edit "$tag" --draft=false --latest
