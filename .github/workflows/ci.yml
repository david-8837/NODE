name: Macro Pad Quality & Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Build, Lint, and Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=low

      - name: Strict Typecheck (TypeScript)
        run: npm run lint

      - name: Production Web Build
        run: npm run build

      - name: Enforce JavaScript Bundle Budget
        run: npm run check:bundle

      - name: Run Vitest Unit & Integration Suites
        run: npm test


