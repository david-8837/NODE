name: 'Feature Request'
description: 'Suggest an idea, enhancement, or new capability for NODE studio'
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for NODE studio? Let us know what you have in mind!
  - type: textarea
    id: problem
    attributes:
      label: 'Problem or Motivation'
      description: 'Is your feature request related to a problem or limitation? (e.g. "I find it tedious to...")'
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 'Proposed Solution'
      description: 'Describe the feature or improvement you would like to see added.'
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 'Alternatives Considered'
      description: 'Any alternative solutions or workarounds you have considered?'
  - type: textarea
    id: context
    attributes:
      label: 'Additional Context'
      description: 'Add any mockups, screenshots, or extra notes.'
